<!-- Contact Form Section -->
<div class="container mt-4">
  <h1 class="text-center">Kontaktformular</h1>
  <div class="row justify-content-center">
    <div class="col-md-6">
      <form>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" class="form-control" id="name" placeholder="Dein Name">
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Deine Email-Adresse">
        </div>
        <div class="form-group">
          <label for="message">Nachricht</label>
          <textarea class="form-control" id="message" rows="4" placeholder="Deine Nachricht"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Absenden</button>
      </form>
    </div>
  </div>
</div>
